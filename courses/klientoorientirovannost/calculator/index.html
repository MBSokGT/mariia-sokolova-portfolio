<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>Калькулятор стоимости сиропа на порцию</title><style>
:root{color-scheme:light;--paper:#f6f4ef;--ink:#292b2e;--muted:#6e7379;--red:#a51e32;--track:#e5e4e2;--line:#e5e1da;--serif:Georgia,'Times New Roman',serif;--sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}.widget{max-width:1120px;margin:auto;padding:clamp(26px,5vw,58px) clamp(22px,4vw,54px)}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,.95fr);gap:clamp(38px,7vw,88px);align-items:start}.controls{display:grid;gap:24px}.field{display:grid;gap:9px}.head{display:flex;justify-content:space-between;align-items:baseline}.head label{font-size:17px;font-weight:550}.unit,.small{font-size:12px;color:var(--muted)}.value{width:100%;max-width:270px;padding:0;border:0;border-bottom:1px solid transparent;background:none;color:var(--red);font:500 clamp(40px,6vw,58px)/1.08 var(--serif);letter-spacing:-.035em;outline:none}.value:focus{border-color:var(--red)}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{appearance:none}.range{width:100%;height:24px;margin:0;appearance:none;background:none;cursor:pointer;--fill:25%}.range::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--red) 0 var(--fill),var(--track) var(--fill) 100%);border:1px solid white}.range::-moz-range-track{height:8px;border-radius:99px;background:var(--track);border:1px solid white}.range::-moz-range-progress{height:8px;border-radius:99px;background:var(--red)}.range::-webkit-slider-thumb{appearance:none;width:27px;height:27px;border-radius:50%;margin-top:-10px;background:#fffefa;border:1px solid #e6e1da;box-shadow:0 1px 5px #17191b24}.range::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fffefa;border:1px solid #e6e1da;box-shadow:0 1px 5px #17191b24}.range:focus-visible{outline:2px solid var(--red);outline-offset:4px}.result{padding-top:2px}.label{font-size:18px;color:var(--muted);font-weight:520;max-width:410px}.cost{display:block;margin:24px 0 20px;color:var(--red);font:500 clamp(50px,7vw,68px)/1 var(--serif);letter-spacing:-.04em}.formula{color:var(--muted);font-size:15px;max-width:470px}.servings{margin:22px 0 0;color:var(--muted)}.servings strong{color:var(--ink)}.foot{margin:23px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:#7b7e82}.reset{margin-top:21px;border:0;border-bottom:1px solid #9b9b98;padding:2px 0;background:none;color:#65696c;font:inherit;font-size:12px;cursor:pointer}.reset:hover{color:var(--red)}@media(max-width:700px){.widget{padding:25px 22px 30px}.layout{grid-template-columns:1fr;gap:32px}.controls{gap:19px}.value{font-size:44px}.result{border-top:1px solid var(--line);padding-top:23px}.label{font-size:16px}.cost{margin:14px 0;font-size:54px}.formula,.servings{font-size:14px}}
</style></head><body><main class="widget" id="widget"><div class="layout"><form class="controls" onsubmit="return false" aria-label="Параметры расчёта"><div class="field"><div class="head"><label for="price">Цена бутылки</label><span class="unit">₽</span></div><input class="value" id="price" type="number" min="1" max="100000" step="1" value="520" inputmode="decimal"><input class="range" id="priceRange" type="range" min="100" max="3000" step="10" value="520" aria-label="Цена бутылки"></div><div class="field"><div class="head"><label for="volume">Объём бутылки</label><span class="unit">мл</span></div><input class="value" id="volume" type="number" min="1" max="10000" step="1" value="1000" inputmode="decimal"><input class="range" id="volumeRange" type="range" min="250" max="2000" step="50" value="1000" aria-label="Объём бутылки"></div><div class="field"><div class="head"><label for="dose">Дозировка на порцию</label><span class="unit">мл</span></div><input class="value" id="dose" type="number" min="0.1" max="1000" step="0.5" value="25" inputmode="decimal"><input class="range" id="doseRange" type="range" min="5" max="100" step="1" value="25" aria-label="Дозировка на порцию"></div><button class="reset" id="reset" type="button">Сбросить к учебному примеру</button></form><section class="result" aria-live="polite"><div class="label">Учебная оценка стоимости сиропа на порцию</div><output class="cost" id="cost">13 ₽</output><div class="formula">Цена бутылки ÷ (объём бутылки ÷ дозировка)</div><p class="servings" id="servings">При этих условиях из бутылки получится около <strong>40 порций</strong>.</p><p class="foot">В расчёте только сироп. Не учтены молоко, кофе, другие ингредиенты, труд, потери и списания. Используйте подтверждённые данные клиента.</p></section></div></main><script>(()=>{const init={price:520,volume:1000,dose:25},fields={};for(const k of Object.keys(init))fields[k]={num:document.getElementById(k),range:document.getElementById(k+'Range')};const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n);function calc(){let vals={};for(const [k,f]of Object.entries(fields)){vals[k]=+f.num.value;const v=Math.max(+f.range.min,Math.min(+f.range.max,vals[k]));f.range.value=v;f.range.style.setProperty('--fill',((v-+f.range.min)/(+f.range.max-+f.range.min)*100)+'%')}const {price,volume,dose}=vals;if(!price||!volume||!dose||Object.values(vals).some(n=>!Number.isFinite(n)||n<=0)){document.getElementById('cost').textContent='—';document.getElementById('servings').textContent='Введите значения больше нуля.';return}const portions=volume/dose;document.getElementById('cost').textContent=fmt(price/portions)+' ₽';document.getElementById('servings').innerHTML='При этих условиях из бутылки получится около <strong>'+fmt(portions)+' порций</strong>.';parent.postMessage({type:'syrup-calculator-resize',height:document.documentElement.scrollHeight},'*')}for(const f of Object.values(fields)){f.num.addEventListener('input',calc);f.range.addEventListener('input',()=>{f.num.value=f.range.value;calc()})}document.getElementById('reset').onclick=()=>{for(const [k,v]of Object.entries(init)){fields[k].num.value=v;fields[k].range.value=v}calc()};new ResizeObserver(calc).observe(document.body);calc()})();</script></body></html>
